{% extends 'ui/base.html' %}
{% load attr %}

{% block content %}
<section class="card">
    <div class="section-head">
        <div>
            <p class="eyebrow">CRUD</p>
            <h3>{{ spec.title }}</h3>
        </div>
        <div class="button-row">
            <a class="btn btn-secondary" href="{% url 'ui:crud_index' %}">Все таблицы</a>
            <a class="btn btn-primary" href="{% url 'ui:crud_create' spec.slug %}">Добавить</a>
        </div>
    </div>
    <div class="table-shell">
        <table>
            <thead>
                <tr>
                    {% for f in fields %}<th>{{ f }}</th>{% endfor %}
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for row in rows %}
                    <tr>
                        {% for f in fields %}
                            <td>{{ row|attr:f }}</td>
                        {% endfor %}
                        <td style="white-space:nowrap">
                            <a class="btn btn-secondary" href="{% url 'ui:crud_update' spec.slug row.pk %}">Изменить</a>
                            <a class="btn btn-secondary" href="{% url 'ui:crud_delete' spec.slug row.pk %}">Удалить</a>
                        </td>
                    </tr>
                {% empty %}
                    <tr><td colspan="99">Нет данных</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
