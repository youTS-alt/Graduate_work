{% extends 'ui/base.html' %}

{% block content %}
<section class="card">
    <div class="section-head">
        <div>
            <p class="eyebrow">CRUD</p>
            <h3>{{ spec.title }}</h3>
        </div>
        <div class="button-row">
            <a class="btn btn-secondary" href="{% url 'ui:crud_list' spec.slug %}">Назад</a>
        </div>
    </div>
    <p>Удалить запись: <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="button-row">
            <button class="btn btn-primary" type="submit">Удалить</button>
        </div>
    </form>
</section>
{% endblock %}
